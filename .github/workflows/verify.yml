name: Verify and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in package.json as a release (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - run: npm run test:browser
      - run: npm run package:release
      - name: Check committed distributions
        run: |
          git diff --exit-code -- Emulsion.html downloads/
          test -z "$(git status --porcelain -- Emulsion.html downloads/)"
          cd downloads
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: emulsion-release
          path: |
            Emulsion.html
            downloads/emulsion-plugin-*.zip
            downloads/SHA256SUMS
  release:
    # A pushed vX.Y.Z tag, or a manual run on main with "publish" ticked.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - name: Publish verified files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir -p release
          cp Emulsion.html "downloads/emulsion-plugin-$RELEASE_TAG.zip" release/
          cd release
          sha256sum Emulsion.html "emulsion-plugin-$RELEASE_TAG.zip" > SHA256SUMS
          # A manual run creates the tag on the verified commit. It fails if that release already exists.
          if [ "$GITHUB_REF_TYPE" = tag ]; then where=--verify-tag; else where="--target=$GITHUB_SHA"; fi
          gh release create "$RELEASE_TAG" ./* "$where" --title "Emulsion $RELEASE_TAG" --notes-file ../docs/release-notes.md
